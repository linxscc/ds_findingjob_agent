  - name: "Canva"
    name_cn: "可画"
    type: generic_web
    url: "https://www.lifeatcanva.com/en/jobs"
    china_locations: ["Beijing", "China"]
    selectors:
      job_list: "a[href*='/jobs/']"
      title: "h2, h3"
      location: "[class*='location']"
      link: "a[href*='/jobs/']"
    enabled: false  # Cloudflare 保护，需 stealth 方案

